name: DCO

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: DCO check
    runs-on: ubuntu-26.04
    steps:
      - name: Run DCO check
        uses: christophebedard/dco-check@ce494b79603fa6a2d61ce759a6fe051a67219c1c # 0.6.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DCO_CHECK_VERBOSE: "true"
          # Dependabot signs off with a different address than it commits with.
          DCO_CHECK_EXCLUDE_PATTERN: dependabot\[bot\]@users\.noreply\.github\.com
